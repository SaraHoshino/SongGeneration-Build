name: SongGeneration Linux dependency check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/songgeneration-prepare.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  linux-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Free space and record runner details
        run: |
          df -h
          python --version
          mkdir -p reports
          uname -a > reports/runner.txt
          python --version >> reports/runner.txt 2>&1
      - name: Download upstream LeVo source
        run: |
          git clone --depth=1 https://github.com/levo-demo/LeVo.git upstream-LeVo
          git -C upstream-LeVo rev-parse HEAD | tee reports/upstream-commit.txt
      - name: Validate source files without a GPU
        run: |
          python -m compileall -q upstream-LeVo
          bash -n upstream-LeVo/generate.sh
          cp upstream-LeVo/requirements.txt reports/requirements.txt
          cp upstream-LeVo/requirements_nodeps.txt reports/requirements_nodeps.txt
      - name: Verify Linux dependency installation (CPU-only torch)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r upstream-LeVo/requirements.txt
          # The upstream pins conflict:
          # Hydra 1.0.7 expects OmegaConf <2.1, while upstream pins OmegaConf 2.2.0.
          # Hydra 1.3.2 and OmegaConf 2.3.0 both require ANTLR 4.9.x.
          # Patch only our temporary CI copy, not Tencent's files.
          sed -e 's/^hydra-core==1[.]0[.]7$/hydra-core==1.3.2/' \
              -e 's/^omegaconf==2[.]2[.]0$/omegaconf==2.3.0/' \
              -e 's/^antlr4-python3-runtime==4[.]8$/antlr4-python3-runtime==4.9.3/' \
              upstream-LeVo/requirements_nodeps.txt > reports/requirements_nodeps-compatible.txt
          python -m pip install --no-deps -r reports/requirements_nodeps-compatible.txt
          python -m pip check | tee reports/pip-check.txt
          python -m pip freeze > reports/pip-freeze.txt
          python - <<'PY' | tee reports/import-test.txt
          import torch, torchaudio, transformers, diffusers
          from hydra import compose, initialize
          from omegaconf import OmegaConf
          print('torch:', torch.__version__, 'CUDA:', torch.cuda.is_available())
          print('torchaudio:', torchaudio.__version__)
          print('transformers:', transformers.__version__)
          print('diffusers:', diffusers.__version__)
          print('OmegaConf:', OmegaConf.create({'status': 'ok'}))
          PY
      - name: Package local setup scripts and reports
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          cp -r scripts dist/
          cp README.md dist/
          cp -r reports dist/reports
          tar czf songgeneration-local-kit.tar.gz -C dist .
      - name: Upload setup kit and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songgeneration-linux-check-and-local-kit
          path: songgeneration-local-kit.tar.gz
          if-no-files-found: warn
          retention-days: 7
